<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Campus boundary -->
  <rect x="20" y="20" width="760" height="460" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="400" y="15" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="sans-serif">SCET Campus</text>
  
  <!-- Block A -->
  <rect x="40" y="40" width="180" height="130" rx="6" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" fill="#1d4ed8" font-size="14" font-weight="bold" font-family="sans-serif">Block A</text>
  <text x="130" y="115" text-anchor="middle" fill="#3b82f6" font-size="11" font-family="sans-serif">Admin + Labs</text>
  
  <!-- Block B -->
  <rect x="310" y="40" width="180" height="130" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" fill="#15803d" font-size="14" font-weight="bold" font-family="sans-serif">Block B</text>
  <text x="400" y="115" text-anchor="middle" fill="#16a34a" font-size="11" font-family="sans-serif">Classrooms</text>
  
  <!-- Block C -->
  <rect x="580" y="40" width="180" height="130" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="95" text-anchor="middle" fill="#92400e" font-size="14" font-weight="bold" font-family="sans-serif">Block C</text>
  <text x="670" y="115" text-anchor="middle" fill="#b45309" font-size="11" font-family="sans-serif">Computer Labs</text>
  
  <!-- Block D -->
  <rect x="580" y="250" width="180" height="130" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="670" y="305" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="bold" font-family="sans-serif">Block D</text>
  <text x="670" y="325" text-anchor="middle" fill="#7c3aed" font-size="11" font-family="sans-serif">Library</text>
  
  <!-- Main Cafeteria -->
  <rect x="40" y="250" width="240" height="110" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="160" y="300" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold" font-family="sans-serif">Main Cafeteria</text>
  <text x="160" y="320" text-anchor="middle" fill="#dc2626" font-size="11" font-family="sans-serif">Zone: CANTEEN</text>
  
  <!-- Sports Ground -->
  <rect x="310" y="250" width="240" height="180" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="430" y="330" text-anchor="middle" fill="#065f46" font-size="14" font-weight="bold" font-family="sans-serif">Sports Ground</text>
  <text x="430" y="350" text-anchor="middle" fill="#059669" font-size="11" font-family="sans-serif">Zone: GROUND</text>
  
  <!-- Corridors -->
  <rect x="40" y="190" width="180" height="40" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="130" y="215" text-anchor="middle" fill="#0369a1" font-size="11" font-family="sans-serif">Corridor A-B</text>
  
  <rect x="240" y="190" width="320" height="40" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1"/>
  <text x="400" y="215" text-anchor="middle" fill="#0369a1" font-size="11" font-family="sans-serif">Main Corridor</text>
  
  <!-- Restrooms -->
  <rect x="40" y="390" width="70" height="60" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="75" y="418" text-anchor="middle" fill="#9d174d" font-size="9" font-family="sans-serif">Boys</text>
  <text x="75" y="432" text-anchor="middle" fill="#9d174d" font-size="9" font-family="sans-serif">WC-A</text>
  
  <rect x="130" y="390" width="70" height="60" rx="4" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="165" y="418" text-anchor="middle" fill="#9d174d" font-size="9" font-family="sans-serif">Girls</text>
  <text x="165" y="432" text-anchor="middle" fill="#9d174d" font-size="9" font-family="sans-serif">WC-A</text>
  
  <!-- Labels -->
  <text x="400" y="485" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Swachh Campus 360 · SCET Campus Map (Simplified)</text>
</svg>
